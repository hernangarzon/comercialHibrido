# Railway (y la mayoría de plataformas) asignan el puerto en PORT; en local se usa SERVER_PORT o 8084.
server.port=${PORT:${SERVER_PORT:8084}}
# Detrás del proxy HTTPS de la plataforma: respeta X-Forwarded-* para conocer la IP real
# del visitante (límite anti-spam) y el esquema https (URL del webhook que se muestra).
server.forward-headers-strategy=framework

# Carga variables desde .env (ignorado por git) cuando se ejecuta en local.
# En Docker/produccion las variables llegan por el entorno del proceso.
spring.config.import=optional:file:.env[.properties]

# ============================================================
# DATASOURCE (SUPABASE SESSION POOLER IPv4)
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ESQUEMA: lo gestiona Flyway (db/migration); Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
# Una base que ya existía sin Flyway se marca como V1 sin ejecutar nada sobre ella.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ============================================================
# IA GRATUITA (GROQ)
# ============================================================
openai.api-base-url=${OPENAI_API_BASE_URL:https://api.groq.com/openai/v1}
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:openai/gpt-oss-20b}


# ============================================================
# WHATSAPP
# ============================================================
whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}

# ============================================================
# SEGURIDAD
# ============================================================
# Secreto HMAC para firmar los JWT del panel (minimo 32 caracteres).
# Acepta AGENT_JWT_SECRET o, si no existe, JWT_SECRET (nombre usado en algunas plataformas).
agent.jwt.secret=${AGENT_JWT_SECRET:${JWT_SECRET:}}
# App Secret de Meta; sin el, el webhook rechaza todas las peticiones.
agent.whatsapp-app-secret=${WHATSAPP_APP_SECRET:}
# Correos (separados por coma) de los dueños de la plataforma: ven las solicitudes de la landing.
platform.admin-emails=${PLATFORM_ADMIN_EMAILS:}
# WhatsApp de ventas para el botón de la landing (formato internacional). Vacío = sin botón.
platform.sales-whatsapp=${SALES_WHATSAPP:}
# Orígenes extra (separados por coma) para /ws si el panel se sirve desde otro dominio.
agent.panel-allowed-origins=${PANEL_ALLOWED_ORIGINS:}

# ============================================================
# AGENT WORKER 24/7
# ============================================================
spring.task.scheduling.pool.size=2
agent.worker-fixed-delay-ms=${AGENT_WORKER_FIXED_DELAY_MS:1000}
agent.max-attempts=${AGENT_MAX_ATTEMPTS:3}
agent.retry-base-seconds=${AGENT_RETRY_BASE_SECONDS:5}
agent.stale-job-minutes=${AGENT_STALE_JOB_MINUTES:5}


# ============================================================
# HIKARICP OPTIMIZADO PARA SUPABASE POOLER
# ============================================================
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
