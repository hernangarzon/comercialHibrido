# ============================================================
# PERFIL DEV: base en memoria + datos de demostración
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# No necesita PostgreSQL/Supabase. Los datos se pierden al reiniciar.
# ============================================================
spring.datasource.url=jdbc:h2:mem:comercial;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# H2 en memoria: el esquema lo crea Hibernate; las migraciones son para PostgreSQL.
spring.flyway.enabled=false

# Valores locales para poder arrancar sin .env. Si .env define estas variables, se usan esas.
agent.jwt.secret=${AGENT_JWT_SECRET:dev-solo-local-no-usar-en-produccion-0123456789}
openai.api-key=${OPENAI_API_KEY:sin-configurar}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:dev-phone-1}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:sin-configurar}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:dev-verify-token}

# En dev, admin@demo.com ve también las solicitudes de la landing.
platform.admin-emails=${PLATFORM_ADMIN_EMAILS:admin@demo.com}
platform.sales-whatsapp=${SALES_WHATSAPP:+57 300 000 0000}

# Secreto fijo para poder firmar webhooks de prueba en local (ver README).
agent.whatsapp-app-secret=dev-app-secret
