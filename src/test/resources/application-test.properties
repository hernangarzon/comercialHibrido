# Configuración aislada para tests: H2 en memoria y valores ficticios.
# Sobrescribe todo lo que en application.properties viene de variables de entorno o .env.
spring.datasource.url=jdbc:h2:mem:tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
